# SecretSpec declarations for the fatihaziz.com site repo.
#
# Values NEVER live in this file or in .env. They live in the OS keyring.
# Set them once per machine:
#
#   secretspec set CLOUDFLARE_API_TOKEN
#
# Then run any command with the secret injected:
#
#   secretspec run --reason "Point apex DNS at Fly" -- flarectl dns list --zone fatihaziz.com
#
[project]
name = "fatihaziz-web"
revision = "1.0"
require_reason = "agents"

[providers]
keyring = "keyring://"
env = "env://"

[profiles.default]
# Cloudflare API token scoped to Zone:DNS:Edit + Zone:Zone:Read for fatihaziz.com.
# flarectl reads it from CF_API_TOKEN; see the alias note in AGENTS/CLAUDE docs.
CLOUDFLARE_API_TOKEN = { description = "Cloudflare API token (Zone.DNS edit) for fatihaziz.com", required = true, providers = ["keyring"] }
CF_API_TOKEN = { description = "Same Cloudflare token under the name flarectl expects", required = false, providers = ["keyring"] }
FLY_ACCESS_TOKEN = { description = "Fly.io API token used by flyctl for app fatihaziz-web", required = false, providers = ["keyring"] }

[profiles.ci]
CLOUDFLARE_API_TOKEN = { description = "Cloudflare API token (Zone.DNS edit) for fatihaziz.com", required = true, providers = ["env"] }
CF_API_TOKEN = { description = "Same Cloudflare token under the name flarectl expects", required = false, providers = ["env"] }
FLY_ACCESS_TOKEN = { description = "Fly.io API token used by flyctl for app fatihaziz-web", required = false, providers = ["env"] }
